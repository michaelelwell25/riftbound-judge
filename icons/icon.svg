<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4466"/>
      <stop offset="50%" stop-color="#cc2244"/>
      <stop offset="100%" stop-color="#881133"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6680"/>
      <stop offset="100%" stop-color="#ff3355"/>
    </linearGradient>
    <linearGradient id="riftGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4466" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4466" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="3"/>
      <feComposite in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="-0.5" k4="0"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M256 28 L440 100 C440 100 450 280 256 484 C62 280 72 100 72 100 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle for Android adaptive icon -->
  <rect width="512" height="512" rx="96" fill="#0a0a18"/>

  <!-- Shield body -->
  <path d="M256 42 L428 108 C428 108 438 272 256 468 C74 272 84 108 84 108 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner shield border accent -->
  <path d="M256 62 L410 120 C410 120 420 268 256 448 C92 268 102 120 102 120 Z"
        fill="none" stroke="#ff4466" stroke-width="1" opacity="0.25"/>

  <!-- Rift energy crack (vertical) -->
  <g filter="glow" opacity="0.35" clip-path="url(#shieldClip)">
    <path d="M256 80 L260 140 L252 180 L258 230 L250 280 L256 340 L254 400 L256 450"
          fill="none" stroke="#ff4466" stroke-width="3" stroke-linecap="round"/>
    <path d="M256 80 L260 140 L252 180 L258 230 L250 280 L256 340 L254 400 L256 450"
          fill="none" stroke="#ff99aa" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Horizontal divider line -->
  <line x1="140" y1="290" x2="372" y2="290" stroke="#ff4466" stroke-width="1.5" opacity="0.3"/>

  <!-- RJ Text -->
  <g filter="glow">
    <text x="256" y="255" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="150" font-weight="bold" fill="url(#textGrad)" letter-spacing="-4">RJ</text>
  </g>

  <!-- Small "JUDGE" text below -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="36" font-weight="bold" fill="#ff4466" letter-spacing="16" opacity="0.7">JUDGE</text>

  <!-- Top decorative dots -->
  <circle cx="256" cy="80" r="4" fill="#ff4466" opacity="0.5"/>
  <circle cx="236" cy="84" r="2" fill="#ff4466" opacity="0.3"/>
  <circle cx="276" cy="84" r="2" fill="#ff4466" opacity="0.3"/>
</svg>
